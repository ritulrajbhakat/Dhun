name: CI & Deploy DHUN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Backend Engine Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests

      - name: Build Release Binaries (Local Helper, Metadata Service & Backend)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins

      - name: Upload Local Helper Executable
        uses: actions/upload-artifact@v4
        with:
          name: dhun-local-helper-windows-x86_64
          path: target/release/dhun-local-helper.exe
          if-no-files-found: error

      - name: Upload Global Metadata Catalogue Executable
        uses: actions/upload-artifact@v4
        with:
          name: dhun-server-windows-x86_64
          path: target/release/dhun-server.exe
          if-no-files-found: error

      - name: Upload Windows Native Executable
        uses: actions/upload-artifact@v4
        with:
          name: dhun-backend-windows-x86_64
          path: target/release/dhun-backend.exe
          if-no-files-found: error

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages



