name: CI & Deploy DHUN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Backend Engine Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests

      - name: Build Release Binaries (Local Helper, Metadata Service & Backend)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins

      - name: Package Windows Local Helper Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-helper-win | Out-Null
          Copy-Item target/release/dhun-local-helper.exe dist-helper-win/
          Copy-Item packaging/windows/*.ps1 dist-helper-win/
          Copy-Item packaging/windows/*.vbs dist-helper-win/
          Copy-Item docs/LOCAL_HELPER_INSTALL.md dist-helper-win/

      - name: Build Windows One-Click Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging/windows/dhun-helper-setup.iss

      - name: Upload Windows One-Click Installer
        uses: actions/upload-artifact@v4
        with:
          name: DHUN-Local-Helper-Setup-Windows-x86_64
          path: dist-installer-win/DHUN-Local-Helper-Setup.exe
          if-no-files-found: error

      - name: Upload Local Helper Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: dhun-local-helper-windows-x86_64
          path: dist-helper-win/
          if-no-files-found: error

      - name: Upload Global Metadata Catalogue Executable
        uses: actions/upload-artifact@v4
        with:
          name: dhun-server-windows-x86_64
          path: target/release/dhun-server.exe
          if-no-files-found: error

      - name: Upload Windows Native Executable
        uses: actions/upload-artifact@v4
        with:
          name: dhun-backend-windows-x86_64
          path: target/release/dhun-backend.exe
          if-no-files-found: error

  build-linux-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio/Build Libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Local Helper & Global Metadata Catalogue
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin dhun-local-helper --bin dhun-server

      - name: Package Linux Local Helper Bundle
        run: |
          mkdir -p dist-helper-linux
          cp target/release/dhun-local-helper dist-helper-linux/
          cp packaging/unix/*.sh dist-helper-linux/
          cp docs/LOCAL_HELPER_INSTALL.md dist-helper-linux/

      - name: Upload Local Helper Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: dhun-local-helper-linux-x86_64
          path: dist-helper-linux/
          if-no-files-found: error

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages



