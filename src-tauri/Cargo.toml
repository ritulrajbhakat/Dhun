[package]
name = "dhun-backend"
version = "1.0.0"
description = "DHUN — Local-first Standalone DJ Party Application"
authors = ["DHUN Engineering Team"]
edition = "2021"

[lib]
name = "dhun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

# Audio Hardware & Decoding
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"

# Database & Storage
rusqlite = { version = "0.31", features = ["bundled", "backup", "chrono"] }

# Embedded Networking & WebSockets
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }


# HTTP Downloader & Streaming
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# Local IP & QR Code
local-ip-address = "0.6"
qrcode = { version = "0.14", features = ["svg"] }

# Utilities & Analysis
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
ring = "0.17"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

